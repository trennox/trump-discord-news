
name: Trump News Monitor

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trump-feed
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and publish Trump posts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bot.py

     
      - name: Save processed posts
        run: |
          if [ -f seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            cp seen.json /tmp/trump-seen.json
            git fetch origin main
            git reset --hard origin/main
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("seen.json")
          previous = set(json.loads(p.read_text())) if p.exists() else set()
          current = set(json.loads(Path("/tmp/trump-seen.json").read_text()))
          p.write_text(json.dumps(sorted(previous | current), indent=2))
          PY
            git add seen.json
            if ! git diff --cached --quiet; then
              git commit -m "Update processed Trump posts"
              git push origin HEAD:main
            fi
          fi

     
     

